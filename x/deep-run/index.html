<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deep Run — shinwar</title>
<meta name="description" content="Pick a class, fight three things in the dark, die anyway.">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="../../assets/shell.css">
<style>
  /* experiment-local CSS. never in shell.css. */

  .stage { justify-content: flex-start; gap: 0; padding-top: 1rem; }

  .game {
    width: 100%;
    max-width: 44rem;
    margin: 0 auto;
    text-align: left;
    display: flex;
    flex-direction: column;
    gap: .85rem;
  }

  .card2 {
    border: 1px solid var(--line);
    border-radius: .7rem;
    background: var(--surface);
    padding: .85rem .9rem;
  }

  .row { display: flex; align-items: baseline; justify-content: space-between; gap: .6rem; }
  .who { font-weight: 600; letter-spacing: -.01em; }
  .nums { font-variant-numeric: tabular-nums; font-size: .85rem; color: var(--muted); }

  /* ---------- class select ---------- */

  .pick-head { text-align: center; margin-bottom: .2rem; }
  .pick-head h2 { font-size: 1.15rem; font-weight: 600; letter-spacing: -.01em; }
  .pick-head p { color: var(--muted); font-size: .9rem; margin-top: .25rem; }

  .picks { display: grid; gap: .75rem; }
  @media (min-width: 46rem) { .picks { grid-template-columns: repeat(3, 1fr); } }

  .pick {
    display: flex; flex-direction: column; gap: .3rem;
    text-align: left; padding: 1rem; min-height: 44px;
    border: 1px solid var(--line); border-radius: .7rem;
    background: var(--surface); cursor: pointer;
    transition: border-color .15s, transform .15s;
  }
  .pick:hover { transform: translateY(-2px); }
  .pick:active { transform: none; }
  .pick h3 { font-size: 1rem; font-weight: 600; }
  .pick .role { font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--c); }
  .pick p { color: var(--muted); font-size: .85rem; line-height: 1.45; }
  .pick ul { display: flex; flex-direction: column; gap: .15rem; margin-top: .2rem; }
  .pick li { color: var(--muted); font-size: .8rem; }
  .pick li b { color: var(--ink); font-weight: 600; }
  .pick:hover, .pick:focus-visible { border-color: var(--c); }

  .c-jug { --c: #c2410c; } .c-hun { --c: #0f766e; } .c-wiz { --c: #6d28d9; }
  @media (prefers-color-scheme: dark) {
    .c-jug { --c: #fb923c; } .c-hun { --c: #5eead4; } .c-wiz { --c: #a78bfa; }
  }

  /* ---------- bars ---------- */

  .bar {
    position: relative; height: .7rem; margin-top: .4rem;
    border-radius: 999px; overflow: hidden;
    background: color-mix(in srgb, var(--ink) 12%, transparent);
  }
  .bar > i {
    position: absolute; inset: 0 auto 0 0; display: block; height: 100%;
    border-radius: 999px; background: var(--bar, var(--ink)); transition: width .25s ease;
  }
  .bar-hp{--bar:#b91c1c}.bar-you{--bar:#15803d}.bar-bear{--bar:#a16207}
  .bar-rage{--bar:#c2410c}.bar-focus{--bar:#0f766e}.bar-mana{--bar:#1d4ed8}.bar-shield{--bar:#0891b2}
  @media (prefers-color-scheme: dark) {
    .bar-hp{--bar:#f87171}.bar-you{--bar:#4ade80}.bar-bear{--bar:#fcd34d}
    .bar-rage{--bar:#fb923c}.bar-focus{--bar:#5eead4}.bar-mana{--bar:#60a5fa}.bar-shield{--bar:#67e8f9}
  }

  .intent { margin-top: .5rem; font-size: .82rem; color: var(--muted); }
  .intent b { color: var(--ink); font-weight: 600; }

  /* ---------- energy pips ---------- */

  .energy { display: flex; align-items: center; gap: .4rem; margin-top: .55rem; }
  .energy .lbl { font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .dots { display: flex; gap: .25rem; }
  .dot {
    width: .78rem; height: .78rem; border-radius: 50%;
    border: 1px solid var(--muted); background: transparent;
  }
  .dot.on { background: var(--ink); border-color: var(--ink); }

  /* ---------- status pips + tooltip bubble ---------- */

  .pips { position: relative; display: flex; flex-wrap: wrap; gap: .35rem; margin-top: .55rem; }
  .pip {
    position: relative;
    font-size: .7rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase;
    padding: .22rem .5rem; min-height: 0;
    border: 1px solid currentColor; border-radius: 999px;
    background: transparent; cursor: help;
  }
  /* the badge reads better small, but the tap area has to clear 44px —
     this stretches the hit box without touching the visual size */
  .pip::after { content: ""; position: absolute; inset: -9px -4px; }
  .pip-enraged{color:#c2410c}.pip-mark{color:#0f766e}.pip-surge{color:#6d28d9}
  .pip-venom{color:#4d7c0f}.pip-weak{color:#a16207}.pip-fury{color:#b91c1c}.pip-life{color:#0e7490}
  @media (prefers-color-scheme: dark) {
    .pip-enraged{color:#fb923c}.pip-mark{color:#5eead4}.pip-surge{color:#a78bfa}
    .pip-venom{color:#a3e635}.pip-weak{color:#fcd34d}.pip-fury{color:#f87171}.pip-life{color:#67e8f9}
  }

  /* anchored to the pips row, not the pip, so it can never push the page sideways */
  .tip {
    position: absolute; left: 0; right: 0; top: calc(100% + .4rem); z-index: 5;
    padding: .5rem .6rem;
    border: 1px solid var(--line); border-radius: .5rem;
    background: var(--surface);
    box-shadow: 0 8px 24px rgba(0,0,0,.28);
    font-size: .78rem; line-height: 1.45; color: var(--muted);
    text-transform: none; letter-spacing: 0; font-weight: 400;
  }
  .tip b { color: var(--ink); font-weight: 600; }
  .pips:has(.tip:not([hidden])) { margin-bottom: 3.4rem; }

  /* ---------- actions ---------- */

  .actions { display: grid; gap: .5rem; }
  @media (min-width: 34rem) { .actions { grid-template-columns: 1fr 1fr; } }

  .act {
    display: flex; flex-direction: column; gap: .12rem; text-align: left;
    min-height: 3.1rem; padding: .55rem .8rem;
    border: 1px solid var(--line); border-radius: .55rem;
    background: var(--surface); cursor: pointer;
    transition: border-color .15s, transform .1s, opacity .15s;
  }
  .act:hover:not(:disabled) { border-color: var(--muted); }
  .act:active:not(:disabled) { transform: scale(.99); }
  .act:disabled { opacity: .4; cursor: not-allowed; }
  .act .t { font-weight: 600; font-size: .92rem; }
  .act .d { color: var(--muted); font-size: .78rem; line-height: 1.35; }
  .act .k { float: right; margin-left: .5rem; font-family: var(--mono); font-size: .7rem; color: var(--muted); }

  .endrow { display: flex; gap: .5rem; align-items: stretch; }
  .endrow .btn { flex: 1 1 auto; font-weight: 600; }

  .items { display: flex; flex-wrap: wrap; gap: .4rem; }
  .item-btn {
    min-height: 2.5rem; padding: .45rem .7rem;
    border: 1px solid var(--line); border-radius: .5rem;
    background: var(--surface); cursor: pointer; font-size: .82rem;
  }
  .item-btn:hover:not(:disabled) { border-color: var(--muted); }
  .item-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* ---------- log ---------- */

  .log {
    height: 8rem; overflow-y: auto; padding: .7rem .8rem;
    border: 1px solid var(--line); border-radius: .55rem; background: var(--surface);
    font-size: .84rem; line-height: 1.5;
    display: flex; flex-direction: column; gap: .22rem;
    user-select: text; -webkit-user-select: text;
  }
  .log p { color: var(--muted); }
  .log p b { color: var(--ink); font-weight: 600; }
  .log p.hit { color: var(--ink); }
  .log .turn { border-top: 1px solid var(--line); margin-top: .3rem; padding-top: .4rem;
               font-size: .72rem; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }

  /* ---------- shop ---------- */

  .shop-head { display: flex; align-items: baseline; justify-content: space-between; gap: .6rem; }
  .shop-head h2 { font-size: 1.1rem; font-weight: 600; }
  .gold { font-variant-numeric: tabular-nums; font-weight: 600; }
  .wares { display: grid; gap: .5rem; margin-top: .2rem; }
  @media (min-width: 34rem) { .wares { grid-template-columns: 1fr 1fr; } }
  .ware {
    display: flex; flex-direction: column; gap: .12rem; text-align: left;
    min-height: 3.4rem; padding: .6rem .8rem;
    border: 1px solid var(--line); border-radius: .55rem; background: var(--surface);
    cursor: pointer; transition: border-color .15s;
  }
  .ware:hover:not(:disabled) { border-color: var(--muted); }
  .ware:disabled { opacity: .4; cursor: not-allowed; }
  .ware .t { font-weight: 600; font-size: .9rem; }
  .ware .t span { float: right; margin-left: .5rem; color: var(--muted); font-variant-numeric: tabular-nums; }
  .ware .d { color: var(--muted); font-size: .78rem; line-height: 1.35; }

  /* ---------- result ---------- */

  .result { text-align: center; padding: 1.5rem 0; }
  .result h2 { font-size: 1.4rem; font-weight: 600; }
  .result p { color: var(--muted); margin-top: .4rem; }
  .center { display: flex; justify-content: center; }
  .mt { margin-top: .85rem; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<header class="xbar">
  <a class="xbar-back" href="../../index.html">←&nbsp;<span>shinwar</span></a>
  <h1 class="xbar-title">Deep Run</h1>
  <span class="tag tag-arcade">Arcade</span>
</header>

<main class="stage no-select">
  <div class="game">

    <section id="select">
      <div class="pick-head">
        <h2>Three fights. One run.</h2>
        <p>Spend your energy, then end your turn. Nothing is saved.</p>
      </div>
      <div class="picks" id="picks"></div>
    </section>

    <section id="combat" hidden>
      <div class="card2">
        <div class="row">
          <span class="who" id="foeName">—</span>
          <span class="nums" id="foeHpText">—</span>
        </div>
        <div class="bar"><i id="foeHpBar" class="bar-hp"></i></div>
        <div class="pips" id="foePips"></div>
        <p class="intent" id="foeIntent"></p>
      </div>

      <div class="card2 mt">
        <div class="row">
          <span class="who" id="youName">—</span>
          <span class="nums" id="youHpText">—</span>
        </div>
        <div class="bar"><i id="youHpBar" class="bar-you"></i></div>

        <div class="row" style="margin-top:.5rem">
          <span class="nums" id="resName">—</span><span class="nums" id="resText">—</span>
        </div>
        <div class="bar"><i id="resBar"></i></div>

        <div id="wardWrap" hidden>
          <div class="row" style="margin-top:.5rem"><span class="nums">Ward</span><span class="nums" id="wardText">—</span></div>
          <div class="bar"><i id="wardBar" class="bar-shield"></i></div>
        </div>

        <div id="bearWrap" hidden>
          <div class="row" style="margin-top:.5rem"><span class="nums">Bear</span><span class="nums" id="bearText">—</span></div>
          <div class="bar"><i id="bearBar" class="bar-bear"></i></div>
        </div>

        <div class="energy">
          <span class="lbl">Energy</span>
          <span class="dots" id="dots"></span>
        </div>

        <div class="pips" id="youPips"></div>
      </div>

      <div class="actions mt" id="actions"></div>

      <div class="items mt" id="items"></div>

      <div class="endrow mt">
        <button class="btn" id="endTurn" type="button">End turn <span style="opacity:.55;font-family:var(--mono);font-size:.75rem">↵</span></button>
      </div>

      <div class="log mt" id="log" role="log" aria-live="polite" aria-label="Combat log"></div>
    </section>

    <section id="shop" hidden>
      <div class="card2">
        <div class="shop-head">
          <h2>A trader, somehow, down here</h2>
          <span class="gold" id="goldText">0g</span>
        </div>
        <p class="nums" id="shopNote" style="margin-top:.3rem">Buy what you can carry.</p>
        <div class="wares" id="wares"></div>
      </div>
      <div class="endrow mt"><button class="btn" id="leaveShop" type="button">Move on</button></div>
    </section>

    <section id="result" hidden>
      <div class="result">
        <h2 id="resultTitle">—</h2>
        <p id="resultText">—</p>
        <div class="center mt"><button class="btn" id="again" type="button">Run again</button></div>
      </div>
    </section>

  </div>
</main>

<script>
(function () {
  "use strict";

  function $(id) { return document.getElementById(id); }
  function rnd(a, b) { return a + Math.floor(Math.random() * (b - a + 1)); }
  function clamp(n, lo, hi) { return n < lo ? lo : n > hi ? hi : n; }
  function el(t, c, x) { var n = document.createElement(t); if (c) n.className = c; if (x != null) n.textContent = x; return n; }

  /* ------------------------------------------------------------------ *
   * status descriptions — one place, used by every tooltip
   * ------------------------------------------------------------------ */

  var TIPS = {
    enraged: "<b>Enraged</b> — you heal for half of every point of damage you deal. Ticks down at the end of each round.",
    mark:    "<b>Hunter's Mark</b> — a debuff on the target. Every hit you land on a marked enemy is a critical, for double damage.",
    surge:   "<b>Surge</b> — your abilities cost 2 less mana, to a minimum of nothing.",
    venom:   "<b>Venom</b> — 3 damage at the end of each round. It ignores the bear and the ward is the only thing that slows it; it is already in your blood.",
    weak:    "<b>Weakened</b> — you deal 30% less damage until it wears off.",
    fury:    "<b>Furious</b> — this enemy deals 3 more damage per stack. It does not wear off.",
    coiled:  "<b>Coiled</b> — its next attack lands for 6 extra damage, then the coil is spent.",
    life:    "<b>Second Life</b> — once per run, a blow that would kill you leaves you standing instead, with 30% of your health back."
  };

  /* ------------------------------------------------------------------ *
   * classes
   *
   * Energy is the per-turn action budget for everyone. The class resource
   * sits underneath it and behaves differently per class: rage BUILDS from
   * attacking, focus and mana are SPENT and regenerate.
   * ------------------------------------------------------------------ */

  var CLASSES = {
    juggernaut: {
      key: "juggernaut", name: "Juggernaut", role: "Bruiser", css: "c-jug",
      hp: 96,
      res: { name: "Rage", css: "bar-rage", max: 100, start: 0, regen: 0 },
      pitch: "Builds rage by hitting things. Spends it on hitting things harder.",
      bullets: ["<b>96</b> health — the largest pool",
                "Attacks <b>build rage</b>; Enrage spends 50",
                "<b>Second Life</b>: cheat death once per run"],
      abilities: [
        { id: "light", name: "Light Attack", ep: 1, gain: 15,
          desc: "8–12 damage. Builds 15 rage.",
          run: function () { return [hit(rnd(8, 12), "swing low")]; } },
        { id: "heavy", name: "Heavy Attack", ep: 2, gain: 30,
          desc: "18–26 damage. Builds 30 rage.",
          run: function () { return [hit(rnd(18, 26), "bring the hammer down")]; } },
        { id: "enrage", name: "Enrage", ep: 1, cost: 50,
          desc: "3 rounds of lifesteal.",
          run: function () { S.buffs.enraged = 3; return ["You <b>enrage</b>. Blood answers blood."]; } }
      ]
    },

    hunter: {
      key: "hunter", name: "Hunter", role: "Ranger", css: "c-hun",
      hp: 62, bear: 34,
      res: { name: "Focus", css: "bar-focus", max: 60, start: 60, regen: 20 },
      pitch: "Fights behind a bear and marks what it wants dead.",
      bullets: ["<b>62</b> health, plus a <b>34</b>-health bear",
                "The bear soaks hits until it drops",
                "<b>Hunter's Mark</b>: crits against the marked"],
      abilities: [
        { id: "bow", name: "Bow Shot", ep: 1, cost: 15,
          desc: "9–13 damage from range.",
          run: function () { return [hit(rnd(9, 13), "loose an arrow")]; } },
        { id: "dagger", name: "Dagger Strike", ep: 1, cost: 20,
          desc: "Two cuts, 4–7 each.",
          run: function () { return [hit(rnd(4, 7), "slip in a cut"), hit(rnd(4, 7), "and another")]; } },
        { id: "mark", name: "Hunter's Mark", ep: 1, cost: 30,
          desc: "Mark the enemy for 3 rounds. Your hits on it all crit.",
          run: function () { E.mark = 3; return ["You put a <b>mark</b> on it."]; } }
      ]
    },

    wizard: {
      key: "wizard", name: "Wizard", role: "Caster", css: "c-wiz",
      hp: 54,
      res: { name: "Mana", css: "bar-mana", max: 12, start: 12, regen: 4 },
      pitch: "Dies instantly if the ward drops. Do not let the ward drop.",
      bullets: ["<b>54</b> health — glass",
                "<b>Ward</b> absorbs damage before health",
                "<b>Surge</b>: abilities cost 2 less"],
      abilities: [
        { id: "bolt", name: "Arcane Bolt", ep: 1, cost: 2,
          desc: "9–13 damage.",
          run: function () { return [hit(rnd(9, 13), "hurl a bolt")]; } },
        { id: "lance", name: "Frost Lance", ep: 2, cost: 5,
          desc: "17–23 damage.",
          run: function () { return [hit(rnd(17, 23), "drive a lance of ice")]; } },
        { id: "ward", name: "Ward", ep: 1, cost: 4,
          desc: "Absorb 20 damage. Stacks.",
          run: function () { S.ward += 20; return ["A <b>ward</b> settles over you. (+20 absorb)"]; } },
        { id: "surge", name: "Surge", ep: 1, cost: 3,
          desc: "3 rounds: abilities cost 2 less.",
          run: function () { S.buffs.surge = 3; return ["Power floods in. <b>Surge</b>."]; } }
      ]
    }
  };

  /* ------------------------------------------------------------------ *
   * enemies. HP and damage are tuned for a 3-energy turn — the player
   * now acts two or three times per round, so these are much fatter
   * than a one-action-per-turn fight would need.
   * ------------------------------------------------------------------ */

  var ENEMIES = [
    { key: "snake", name: "Pit Snake", hp: 62, gold: 40,
      flavour: "Something long uncoils in the dark.",
      moves: [
        { w: 3, tell: "Bite — 8–12 damage", run: function () { return [hurt(rnd(8, 12), "The snake bites")]; } },
        { w: 2, tell: "Envenom — 6–9 damage, plus venom",
          run: function () { var l = [hurt(rnd(6, 9), "Fangs sink in")]; S.debuffs.venom += 3;
                             l.push("<b>Venom</b> spreads."); return l; } },
        { w: 1, tell: "Coil — winding up",
          run: function () { E.coiled = true; return ["The snake coils, watching you."]; } }
      ] },

    { key: "wolf", name: "Ridge Wolf", hp: 95, gold: 55,
      flavour: "It has been following you for a while.",
      moves: [
        { w: 3, tell: "Maul — 12–18 damage", run: function () { return [hurt(rnd(12, 18), "The wolf mauls")]; } },
        { w: 2, tell: "Lunge — 16–22 damage", run: function () { return [hurt(rnd(16, 22), "It lunges")]; } },
        { w: 1, tell: "Howl — it grows bolder",
          run: function () { E.fury += 1; return ["It throws back its head and <b>howls</b>."]; } }
      ] },

    { key: "corrupted", name: "Corrupted Thing", hp: 145, gold: 0,
      flavour: "It used to be a person. The shape is nearly right.",
      moves: [
        { w: 3, tell: "Ruinous Blow — 17–24 damage", run: function () { return [hurt(rnd(17, 24), "It strikes")]; } },
        { w: 2, tell: "Wither — 10–14 damage, weakens you",
          run: function () { var l = [hurt(rnd(10, 14), "It reaches into you")]; S.debuffs.weak += 2;
                             l.push("You feel <b>weakened</b>."); return l; } },
        { w: 2, tell: "Feed — heals itself 14–20",
          run: function () { var n = rnd(14, 20); E.hp = clamp(E.hp + n, 0, E.maxHp);
                             return ["It <b>feeds</b>. (+" + n + ")"]; } }
      ] }
  ];

  /* ------------------------------------------------------------------ *
   * shop
   * ------------------------------------------------------------------ */

  var WARES = [
    { id: "potion", name: "Health Potion", cost: 20, repeat: true,
      desc: "Carry it. Drink it mid-fight for 30% of your health.",
      buy: function () { S.potions++; } },
    { id: "bandage", name: "Bandages", cost: 15, repeat: true,
      desc: "Patch up right now — heal 25% of your health.",
      buy: function () { S.hp = clamp(S.hp + Math.round(S.maxHp * .25), 0, S.maxHp); } },
    { id: "whetstone", name: "Whetstone", cost: 35, repeat: true,
      desc: "+3 damage on everything you do, permanently.",
      buy: function () { S.bonus += 3; } },
    { id: "vitality", name: "Iron Vitality", cost: 40, repeat: true,
      desc: "+18 maximum health, and heal it immediately.",
      buy: function () { S.maxHp += 18; S.hp += 18; } },
    { id: "attune", name: "Attunement", cost: 30, repeat: true,
      desc: "", /* filled per class */
      buy: function () {
        if (S.key === "juggernaut") S.res.start += 15;
        else S.res.regen += (S.key === "hunter" ? 8 : 2);
      } },
    { id: "adrenaline", name: "Adrenaline", cost: 70, repeat: false,
      desc: "+1 energy every round. Once only, and worth it.",
      buy: function () { S.maxEp += 1; } }
  ];

  function attuneDesc() {
    if (!S) return "";
    if (S.key === "juggernaut") return "Start every fight with 15 more rage.";
    if (S.key === "hunter") return "+8 focus regenerated each round.";
    return "+2 mana regenerated each round.";
  }

  /* ------------------------------------------------------------------ *
   * state
   * ------------------------------------------------------------------ */

  var S = null, E = null, busy = false;

  function newRun(key) {
    var c = CLASSES[key];
    S = {
      cls: c, key: key,
      hp: c.hp, maxHp: c.hp,
      res: { name: c.res.name, css: c.res.css, max: c.res.max, start: c.res.start, regen: c.res.regen, cur: c.res.start },
      ward: 0,
      bearHp: c.bear || 0, bearMaxHp: c.bear || 0,
      maxEp: 3, ep: 3,
      buffs: { enraged: 0, surge: 0 },
      debuffs: { venom: 0, weak: 0 },
      secondLife: key === "juggernaut",
      bonus: 0, gold: 20, potions: 0, bought: {},
      stage: 0
    };
    startFight(0);
  }

  function startFight(i) {
    var t = ENEMIES[i];
    E = { def: t, name: t.name, hp: t.hp, maxHp: t.hp, fury: 0, coiled: false, mark: 0, intent: null };
    S.stage = i;
    S.ward = 0;
    S.debuffs.venom = S.debuffs.weak = 0;
    S.buffs.enraged = S.buffs.surge = 0;
    S.res.cur = S.res.start;
    S.ep = S.maxEp;
    busy = false;
    pickIntent();
    show("combat");
    logTurn(t.flavour + " — <b>" + t.name + "</b>");
    render();
  }

  /* ------------------------------------------------------------------ *
   * damage — one funnel
   * ------------------------------------------------------------------ */

  function hit(base, verb) {
    var dmg = base + S.bonus, crit = false;
    if (E.mark > 0) { dmg = Math.round(dmg * 2); crit = true; }
    if (S.debuffs.weak > 0) dmg = Math.max(1, Math.round(dmg * .7));
    E.hp = clamp(E.hp - dmg, 0, E.maxHp);

    var line = "You " + verb + " for <b>" + dmg + "</b>" + (crit ? " — <b>critical</b>" : "") + ".";
    if (S.buffs.enraged > 0) {
      var back = Math.max(1, Math.round(dmg * .5));
      S.hp = clamp(S.hp + back, 0, S.maxHp);
      line += " You drink <b>" + back + "</b> back.";
    }
    return line;
  }

  function hurt(base, verb) {
    var dmg = base + (E.fury * 3) + (E.coiled ? 6 : 0);
    E.coiled = false;

    if (S.bearMaxHp && S.bearHp > 0) {
      S.bearHp = clamp(S.bearHp - dmg, 0, S.bearMaxHp);
      return verb + " the bear for <b>" + dmg + "</b>." + (S.bearHp === 0 ? " The bear goes down." : "");
    }

    var eaten = 0;
    if (S.ward > 0) { eaten = Math.min(S.ward, dmg); S.ward -= eaten; dmg -= eaten; }
    S.hp = clamp(S.hp - dmg, 0, S.maxHp);

    var out = verb + " you for <b>" + (dmg + eaten) + "</b>";
    if (eaten) out += " — the ward eats <b>" + eaten + "</b>";
    out += ".";
    out += checkDeath();
    return out;
  }

  function checkDeath() {
    if (S.hp === 0 && S.secondLife) {
      S.secondLife = false;
      S.hp = Math.max(1, Math.round(S.maxHp * .3));
      return " <b>You should be dead.</b> You get up with " + S.hp + " health.";
    }
    return "";
  }

  /* ------------------------------------------------------------------ *
   * player turn — spend energy, then end it
   * ------------------------------------------------------------------ */

  function costOf(a) {
    if (a.cost == null) return null;
    return Math.max(0, a.cost - (S.buffs.surge > 0 && S.key === "wizard" ? 2 : 0));
  }

  function usable(a) {
    if (busy) return false;
    if (S.ep < a.ep) return false;
    var c = costOf(a);
    if (c != null && S.res.cur < c) return false;
    return true;
  }

  function act(a) {
    if (!usable(a)) return;
    S.ep -= a.ep;
    var c = costOf(a);
    if (c != null) S.res.cur -= c;
    if (a.gain) S.res.cur = clamp(S.res.cur + a.gain, 0, S.res.max);

    a.run().forEach(function (l) { say(l, true); });
    render();
    if (E.hp === 0) { busy = true; setTimeout(won, 550); }
  }

  function drinkPotion() {
    if (busy || S.potions <= 0 || S.hp >= S.maxHp) return;
    S.potions--;
    var n = Math.round(S.maxHp * .3);
    S.hp = clamp(S.hp + n, 0, S.maxHp);
    say("You drink a potion. <b>+" + n + "</b> health.", true);
    render();
  }

  function endTurn() {
    if (busy) return;
    busy = true;
    render();
    setTimeout(bearTurn, 260);
  }

  function bearTurn() {
    if (S.bearMaxHp && S.bearHp > 0) {
      var d = rnd(4, 7) + S.bonus;
      if (E.mark > 0) d = Math.round(d * 2);
      E.hp = clamp(E.hp - d, 0, E.maxHp);
      say("The bear mauls it for <b>" + d + "</b>.", true);
      render();
      if (E.hp === 0) { setTimeout(won, 550); return; }
    }
    setTimeout(foeTurn, 420);
  }

  function foeTurn() {
    logTurn(E.name);
    E.intent.run().forEach(function (l) { say(l, true); });
    render();
    if (S.hp === 0) { setTimeout(lost, 600); return; }
    setTimeout(upkeep, 460);
  }

  function upkeep() {
    if (S.debuffs.venom > 0) {
      var v = 3;
      if (S.ward > 0) { var a = Math.min(S.ward, v); S.ward -= a; v -= a; }
      S.hp = clamp(S.hp - v, 0, S.maxHp);
      if (v > 0) say("Venom burns for <b>" + v + "</b>." + checkDeath());
      S.debuffs.venom--;
    }

    if (S.buffs.enraged > 0) S.buffs.enraged--;
    if (S.buffs.surge > 0) S.buffs.surge--;
    if (S.debuffs.weak > 0) S.debuffs.weak--;
    if (E.mark > 0) E.mark--;

    S.res.cur = clamp(S.res.cur + S.res.regen, 0, S.res.max);
    S.ep = S.maxEp;

    if (S.hp === 0) { lost(); return; }

    pickIntent();
    busy = false;
    logTurn("Your turn");
    render();
  }

  function pickIntent() {
    var pool = [], i, w;
    for (i = 0; i < E.def.moves.length; i++) {
      var m = E.def.moves[i];
      if (m.tell.indexOf("Feed") === 0 && E.hp === E.maxHp) continue;
      for (w = 0; w < m.w; w++) pool.push(m);
    }
    E.intent = pool[Math.floor(Math.random() * pool.length)];
  }

  /* ------------------------------------------------------------------ *
   * between fights: shop, then the next thing in the dark
   * ------------------------------------------------------------------ */

  function won() {
    busy = false;
    var last = S.stage >= ENEMIES.length - 1;
    if (last) { finish(true); return; }

    S.gold += E.def.gold;
    var heal = Math.round(S.maxHp * .2);
    S.hp = clamp(S.hp + heal, 0, S.maxHp);
    if (S.bearMaxHp && S.bearHp === 0) S.bearHp = Math.round(S.bearMaxHp * .5);

    $("shopNote").textContent =
      E.name + " falls. You take " + E.def.gold + "g off it and bind your wounds (+" + heal + " health)"
      + (S.bearMaxHp && S.bearHp > 0 ? ". The bear gets up too." : ".");
    openShop();
  }

  function openShop() {
    show("shop");
    drawShop();
  }

  function drawShop() {
    $("goldText").textContent = S.gold + "g";
    var box = $("wares");
    box.textContent = "";
    WARES.forEach(function (w) {
      var owned = !w.repeat && S.bought[w.id];
      var b = el("button", "ware");
      b.type = "button";
      b.disabled = owned || S.gold < w.cost;

      var t = el("span", "t");
      t.appendChild(document.createTextNode(w.name));
      var p = el("span", null, owned ? "owned" : w.cost + "g");
      t.appendChild(p);
      b.appendChild(t);
      b.appendChild(el("span", "d", w.id === "attune" ? attuneDesc() : w.desc));

      b.addEventListener("click", function () {
        if (S.gold < w.cost || owned) return;
        S.gold -= w.cost;
        S.bought[w.id] = true;
        w.buy();
        drawShop();
      });
      box.appendChild(b);
    });
  }

  function lost() { busy = false; finish(false); }

  function finish(win) {
    show("result");
    $("resultTitle").textContent = win ? "You made it out." : "You died down there.";
    $("resultText").textContent = win
      ? "Three fights, one " + S.cls.name.toLowerCase() + ", nothing saved. Go again?"
      : "The " + E.name.toLowerCase() + " got you on fight " + (S.stage + 1) + " of " + ENEMIES.length + ".";
    $("again").focus();
  }

  /* ------------------------------------------------------------------ *
   * rendering
   * ------------------------------------------------------------------ */

  function bar(fill, text, cur, max, label) {
    $(fill).style.width = (max ? (cur / max) * 100 : 0) + "%";
    $(text).textContent = label || (cur + " / " + max);
  }

  /* pips are real buttons: hover shows the tip on desktop, focus shows it
     on tap and on keyboard, which covers every input without a library */
  function pips(host, list) {
    host.textContent = "";
    var tip = el("div", "tip");
    tip.hidden = true;
    list.forEach(function (p) {
      var b = el("button", "pip pip-" + p.k, p.t);
      b.type = "button";
      b.setAttribute("aria-label", p.t + ". " + TIPS[p.k].replace(/<[^>]+>/g, ""));
      function open() { tip.innerHTML = TIPS[p.k]; tip.hidden = false; }
      function close() { tip.hidden = true; }
      b.addEventListener("mouseenter", open);
      b.addEventListener("mouseleave", close);
      b.addEventListener("focus", open);
      b.addEventListener("blur", close);
      b.addEventListener("click", function (e) { e.preventDefault(); open(); });
      host.appendChild(b);
    });
    host.appendChild(tip);
  }

  function render() {
    if (!S || !E) return;

    $("foeName").textContent = E.name;
    bar("foeHpBar", "foeHpText", E.hp, E.maxHp);
    $("foeIntent").innerHTML = E.hp > 0 ? "Next: <b>" + E.intent.tell + "</b>" : "";
    var fp = [];
    if (E.mark)   fp.push({ k: "mark",  t: "Marked " + E.mark });
    if (E.fury)   fp.push({ k: "fury",  t: "Furious ×" + E.fury });
    if (E.coiled) fp.push({ k: "coiled", t: "Coiled" });
    pips($("foePips"), fp);

    $("youName").textContent = S.cls.name;
    bar("youHpBar", "youHpText", S.hp, S.maxHp);

    $("resName").textContent = S.res.name;
    $("resBar").className = S.res.css;
    bar("resBar", "resText", S.res.cur, S.res.max);

    $("wardWrap").hidden = S.key !== "wizard";
    if (S.key === "wizard") bar("wardBar", "wardText", Math.min(S.ward, 60), 60, String(S.ward));

    $("bearWrap").hidden = !S.bearMaxHp;
    if (S.bearMaxHp) bar("bearBar", "bearText", S.bearHp, S.bearMaxHp,
                         S.bearHp > 0 ? S.bearHp + " / " + S.bearMaxHp : "down");

    var dots = $("dots");
    dots.textContent = "";
    for (var i = 0; i < S.maxEp; i++) dots.appendChild(el("span", "dot" + (i < S.ep ? " on" : "")));

    var yp = [];
    if (S.buffs.enraged) yp.push({ k: "enraged", t: "Enraged " + S.buffs.enraged });
    if (S.buffs.surge)   yp.push({ k: "surge",   t: "Surge " + S.buffs.surge });
    if (S.debuffs.venom) yp.push({ k: "venom",   t: "Venom " + S.debuffs.venom });
    if (S.debuffs.weak)  yp.push({ k: "weak",    t: "Weakened " + S.debuffs.weak });
    if (S.secondLife)    yp.push({ k: "life",    t: "Second Life" });
    pips($("youPips"), yp);

    drawActions();
    drawItems();
    $("endTurn").disabled = busy;
  }

  function drawActions() {
    var box = $("actions");
    box.textContent = "";
    S.cls.abilities.forEach(function (a, i) {
      var b = el("button", "act");
      b.type = "button";
      b.disabled = !usable(a);

      var t = el("span", "t");
      t.appendChild(document.createTextNode(a.name));
      t.appendChild(el("span", "k", String(i + 1)));
      b.appendChild(t);

      var bits = [a.desc, a.ep + (a.ep === 1 ? " energy" : " energy")];
      var c = costOf(a);
      if (c != null) bits.push(c + " " + S.res.name.toLowerCase());
      b.appendChild(el("span", "d", bits.join(" · ")));

      b.addEventListener("click", function () { act(a); });
      box.appendChild(b);
    });
  }

  function drawItems() {
    var box = $("items");
    box.textContent = "";
    if (S.potions > 0) {
      var b = el("button", "item-btn", "Drink potion (" + S.potions + ")");
      b.type = "button";
      b.disabled = busy || S.hp >= S.maxHp;
      b.addEventListener("click", drinkPotion);
      box.appendChild(b);
    }
    box.appendChild(el("span", "nums", S.gold + "g"));
  }

  function say(html, strong) {
    var p = el("p", strong ? "hit" : null);
    p.innerHTML = html;
    var l = $("log"); l.appendChild(p); l.scrollTop = l.scrollHeight;
  }
  function logTurn(label) {
    var p = el("p", "turn"); p.innerHTML = label;
    var l = $("log"); l.appendChild(p); l.scrollTop = l.scrollHeight;
  }

  function show(which) {
    ["select", "combat", "shop", "result"].forEach(function (id) { $(id).hidden = id !== which; });
  }

  /* ------------------------------------------------------------------ *
   * setup
   * ------------------------------------------------------------------ */

  function buildPicks() {
    var box = $("picks");
    Object.keys(CLASSES).forEach(function (key) {
      var c = CLASSES[key];
      var b = el("button", "pick " + c.css);
      b.type = "button";
      b.appendChild(el("span", "role", c.role));
      b.appendChild(el("h3", null, c.name));
      b.appendChild(el("p", null, c.pitch));
      var ul = el("ul");
      c.bullets.forEach(function (t) { var li = document.createElement("li"); li.innerHTML = t; ul.appendChild(li); });
      b.appendChild(ul);
      b.addEventListener("click", function () { $("log").textContent = ""; newRun(key); });
      box.appendChild(b);
    });
  }

  $("endTurn").addEventListener("click", endTurn);
  $("leaveShop").addEventListener("click", function () { startFight(S.stage + 1); });
  $("again").addEventListener("click", function () {
    S = null; E = null; busy = false;
    $("log").textContent = "";
    show("select");
  });

  document.addEventListener("keydown", function (e) {
    if (!$("combat").hidden && !busy && S) {
      if (e.key === "Enter") { e.preventDefault(); endTurn(); return; }
      var n = parseInt(e.key, 10);
      var a = n && S.cls.abilities[n - 1];
      if (a && usable(a)) { e.preventDefault(); act(a); }
    }
  });

  buildPicks();
})();
</script>
</body>
</html>
